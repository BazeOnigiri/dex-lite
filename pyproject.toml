[project]
name = "dex-lite"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = règles de sécurité (bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                 # assert autorisé dans les tests
